name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Lint (basic)
        run: |
          python -m compileall src tests
          python src/manage.py check

      - name: Unit tests + coverage
        run: |
          coverage run --source=src src/manage.py test tests --verbosity 2
          coverage report -m
          coverage xml -o coverage.xml

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (local image) with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: local-image:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (block on CRITICAL)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: local-image:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          format: table

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push to GHCR
        run: |
          IMAGE_BASE="ghcr.io/${{ github.repository }}"
          IMAGE_BASE_LC="$(echo "$IMAGE_BASE" | tr '[:upper:]' '[:lower:]')"
          docker tag local-image:${{ github.sha }} "$IMAGE_BASE_LC:${{ github.sha }}"
          docker tag local-image:${{ github.sha }} "$IMAGE_BASE_LC:latest"
          docker push "$IMAGE_BASE_LC:${{ github.sha }}"
          docker push "$IMAGE_BASE_LC:latest"
